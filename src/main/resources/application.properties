spring.application.name=predictor

# --------------------------------------------------
# DEFAULT: In-Memory H2 Database Configuration
# --------------------------------------------------
spring.datasource.url=jdbc:h2:mem:busstopdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --------------------------------------------------
# OPTIONAL: Production MySQL Database Configuration
# --------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/bus_stop_predictor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# --------------------------------------------------
# General Settings
# --------------------------------------------------
# Set maximum upload size for CSV data files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
